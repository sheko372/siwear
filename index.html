<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>SI WEAR | Follow & Connect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 18px; background: #111; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100%, 420px); text-align: center; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 20px; border: 1px solid #555;
      display: grid; place-items: center; border-radius: 22px;
      font-size: 22px; font-weight: 800; letter-spacing: -1.5px;
    }
    h1 { margin: 0; font-size: 38px; letter-spacing: 5px; }
    .tagline { margin: 11px 0 34px; color: #aaa; font-size: 11px; letter-spacing: 3px; }
    .links { display: grid; gap: 13px; }
    a {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 58px; padding: 15px 20px; border: 1px solid #444;
      border-radius: 13px; background: #fff; color: #111;
      text-decoration: none; font-weight: 700; font-size: 15px;
      transition: transform .15s ease, background .15s ease;
    }
    a:hover { transform: translateY(-2px); background: #eee; }
    .icon { width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 20px; }
    footer { margin-top: 35px; color: #777; font-size: 10px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">SI</div>
    <h1>SI WEAR</h1>
    <p class="tagline">FOLLOW US &amp; GET IN TOUCH</p>
    <nav class="links" aria-label="SI WEAR social accounts">
      <a href="https://www.instagram.com/si_wearr/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◎</span> Instagram
      </a>
      <a href="https://www.tiktok.com/@si_wear" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">♪</span> TikTok
      </a>
      <a href="https://wa.me/201055581679" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◉</span> WhatsApp
      </a>
    </nav>
    <footer>SCAN · FOLLOW · CONNECT</footer>
  </main>
</body>
</html>
